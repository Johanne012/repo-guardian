# قواعد تقييم الصحة

rules:
  - id: bad_name
    description: اسم مستودع مؤقت
    patterns: ["Repository-name", "temp-", "untitled", "test-repo"]
    severity: critical
    action: confirm_rename

  - id: vercel_down
    description: رابط Vercel يعطي 4xx أو خطأ
    severity: critical
    action: confirm_archive_or_fix

  - id: skeleton_stale
    description: هيكل صغير جداً ومهجور
    severity: critical
    action: confirm_archive

  - id: no_activity_90d
    description: لا push منذ 90+ يوم
    severity: warning
    action: log_only

  - id: very_stale_small
    description: 180+ يوم وحجم صغير
    severity: critical
    action: confirm_archive

  - id: many_issues
    description: أكثر من 5 issues مفتوحة
    severity: warning
    action: log_only

email_policy:
  send_only_on: [critical, confirm]
  never_send_weekly_summary: true
  channels:
    - github_issues   # افتراضي
    - discord_webhook # اختياري عبر secret
    - slack_webhook   # اختياري عبر secret
