name: Repo Guardian Health Check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      auto_issue:
        description: "Create issues for critical findings"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Monitor
        env:
          # GUARDIAN_PAT (optional): classic PAT with `repo` scope for private + all public repos
          # Falls back to GITHUB_TOKEN (limited to this repo context for some APIs)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUARDIAN_PAT: ${{ secrets.GUARDIAN_PAT }}
          GITHUB_OWNER: Johanne012
          REPORT_PATH: report.json
        run: python agent/monitor.py

      - name: Run Decision
        env:
          REPORT_PATH: report.json
          SUMMARY_PATH: summary.md
        run: python agent/decision.py

      - name: Run Healer
        env:
          GITHUB_TOKEN: ${{ secrets.GUARDIAN_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: Johanne012
          REPORT_PATH: report.json
          AUTO_ISSUE: ${{ github.event_name == 'schedule' && 'true' || inputs.auto_issue }}
        run: python agent/healer.py
        continue-on-error: true

      - name: Notify (webhooks if configured)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python agent/notify.py
        continue-on-error: true

      - name: Update memory
        run: python agent/memory.py
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: |
            report.json
            summary.md
            notify.flag
            healer_actions.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Job Summary
        run: |
          echo "## Repo Guardian" >> $GITHUB_STEP_SUMMARY
          if [ -f summary.md ]; then cat summary.md >> $GITHUB_STEP_SUMMARY; fi
